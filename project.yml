name: BabyLog
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  knownRegions: [zh-Hans, en, zh-Hant, ja, ko, de, es, fr, pt-BR, it]
settings:
  base:
    APP_ID: com.hgsldswk.babylog
    APP_STORE_ID: "6836794305"
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  BabyLog:
    type: application
    platform: iOS
    sources: [BabyLog, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DEBUG
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: BabyLog AppStore
    info:
      path: BabyLog/Info.plist
      properties:
        CFBundleDisplayName: 宝宝记录
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        BabyLogProProductID: $(APP_ID).pro
        BabyLogTrialProductID: $(APP_ID).trial
        APP_STORE_ID: $(APP_STORE_ID)
  BabyLogTests:
    type: bundle.unit-test
    platform: iOS
    sources: [BabyLogTests]
    dependencies:
      - target: BabyLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/BabyLog.app/BabyLog
        BUNDLE_LOADER: $(TEST_HOST)
  BabyLogUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [BabyLogUITests]
    dependencies:
      - target: BabyLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: BabyLog
schemes:
  BabyLog:
    build:
      targets:
        BabyLog: all
        BabyLogTests: [test]
    test:
      config: Debug
      targets: [BabyLogTests]
  BabyLogUI:
    build:
      targets:
        BabyLog: all
        BabyLogUITests: [test]
    test:
      config: Debug
      targets: [BabyLogUITests]
